name: RaceDay API CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Locate test project
        id: find
        run: |
          TEST_PROJ=$(find . -name "RaceDay.Api.Tests.csproj" -not -path "*/obj/*" | head -n 1)
          echo "Test project: $TEST_PROJ"
          test -n "$TEST_PROJ"
          echo "tests=$TEST_PROJ" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore "${{ steps.find.outputs.tests }}" --force

      - name: Build
        run: dotnet build "${{ steps.find.outputs.tests }}" --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test "${{ steps.find.outputs.tests }}" --no-build --configuration Release --verbosity normal
